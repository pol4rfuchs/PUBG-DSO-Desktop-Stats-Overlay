name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pubg-electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pubg-electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows executable
        run: npx electron-packager . pubg-overlay --platform=win32 --arch=x64 --out=dist --overwrite --no-prune --ignore=dist

      - name: Zip artifact
        run: Compress-Archive -Path "dist\pubg-overlay-win32-x64\*" -DestinationPath "pubg-overlay-${{ github.ref_name }}-win32-x64.zip"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pubg-electron/pubg-overlay-${{ github.ref_name }}-win32-x64.zip
          generate_release_notes: true
